name: SAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Bandit — static code analysis ─────────────────────────────────────
      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -ll -ii
        # no requirements.txt needed — scans .py files directly

      # ── Snyk Code — SAST (not SCA) ────────────────────────────────────────
      - name: Run Snyk Code SAST scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde
        with:
          command: code test                       # ← "code test" = SAST
          args: --severity-threshold=high          # blocks on high+ findings
        # no requirements.txt needed — scans source code directly

      # ── Upload results to GitHub Security tab ─────────────────────────────
      - name: Upload Snyk SARIF results
        uses: snyk/actions/python@master
        if: always()
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde
        with:
          command: code test
          args: --sarif-file-output=snyk-sast.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-sast.sarif
