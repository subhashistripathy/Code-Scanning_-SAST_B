name: SAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Add this permissions block 
permissions:
  contents: read
  security-events: write      # fixes "Resource not accessible by integration"
  actions: read

jobs:
  sast-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Bandit SAST 
      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: bandit -r . -ll -ii

      # Snyk Code SAST
      - name: Run Snyk Code SAST scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde
        with:
          command: code test
          args: --severity-threshold=high

      # Upload SARIF results 
      - name: Generate Snyk SARIF report
        uses: snyk/actions/python@master
        if: always()
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde
        with:
          command: code test
          args: --sarif-file-output=snyk-sast.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4    # ← v3 to v4
        if: always()
        with:
          sarif_file: snyk-sast.sarif
