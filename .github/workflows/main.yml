name: Code Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install bandit
          pip install -r requirements.txt   # Snyk needs this to scan deps

      # ── Snyk scan ─────────────────────────────────────────────────────────
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde   # ← pulls from GitHub Secrets
        with:
          args: --severity-threshold=high          # blocks on high+ severity
          # options: low | medium | high | critical

      # ── Bandit scan (blocks on code-level issues) ──────────────────────────
      - name: Run Bandit scan
        run: bandit -r . -ll -ii
        # no --exit-zero, no continue-on-error → pipeline fails on findings

      # ── Upload Snyk results to GitHub Security tab (optional but useful) ───
      - name: Upload Snyk results to GitHub
        uses: snyk/actions/python@master
        if: always()                               # runs even if scan fails
        env:
          SNYK_TOKEN: aed514c5-df9e-40d2-8cfc-51990b7a3cde
        with:
          args: --sarif-file-output=snyk.sarif
          
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif
